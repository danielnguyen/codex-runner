name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  openwebui-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/openwebui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: integrations/openwebui/pyproject.toml
      - run: python -m pip install -e '.[test]'
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
